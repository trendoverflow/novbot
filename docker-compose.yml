# Optional MySQL for local development. Bring-your-own MySQL is the primary path.
# MySQL 8.4: do not pass --default-authentication-plugin (removed upstream; caching_sha2 is default).
#
# Credentials use ${VAR} substitution (see demo/.env.example). Inline defaults are
# DEMO-ONLY local values — never reuse in production. Prefer:
#   docker compose --env-file demo/.env up -d
# or ./demo/up.sh
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novbot}
      MYSQL_USER: ${MYSQL_USER:-novbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novbot}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - novbot_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  novbot_mysql:
