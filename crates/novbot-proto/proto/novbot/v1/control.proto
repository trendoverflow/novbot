syntax = "proto3";

package novbot.v1;

// Bi-directional control channel between node and center.
service Control {
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  string request_id = 1;
  oneof body {
    RegisterRequest register = 10;
    HeartbeatRequest heartbeat = 11;
    PullConfigRequest pull_config = 12;
    ReportResultRequest report_result = 13;
    Ack ack = 14;
  }
}

message ServerMessage {
  string request_id = 1;
  oneof body {
    RegisterResponse register = 10;
    HeartbeatResponse heartbeat = 11;
    PullConfigResponse pull_config = 12;
    ReportResultResponse report_result = 13;
    PushConfig push_config = 20;
    Dispatch dispatch = 21;
    PushSchedule push_schedule = 22;
    Ack ack = 30;
    ErrorResponse error = 31;
  }
}

message RegisterRequest {
  string node_id = 1;
  string hostname = 2;
  string version = 3;
  string bootstrap_token = 4;
  map<string, string> labels = 5;
}

message RegisterResponse {
  string node_id = 1;
  bool accepted = 2;
  string message = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  int64 config_generation = 2;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 center_config_generation = 2;
}

message PullConfigRequest {
  string node_id = 1;
  int64 known_generation = 2;
}

message PullConfigResponse {
  int64 config_generation = 1;
  // JSON array of probe Spec objects (see novbot-core::spec).
  string specs_json = 2;
  // JSON array of Schedule objects.
  string schedules_json = 3;
}

message ReportResultRequest {
  string node_id = 1;
  string run_id = 2;
  string spec_id = 3;
  string status = 4; // ok | fail | error
  string payload_json = 5;
  int64 observed_at_unix_ms = 6;
}

message ReportResultResponse {
  bool accepted = 1;
}

message PushConfig {
  int64 config_generation = 1;
  string specs_json = 2;
}

message Dispatch {
  string run_id = 1;
  string spec_id = 2;
  string params_json = 3;
}

message PushSchedule {
  int64 config_generation = 1;
  string schedules_json = 2;
}

message Ack {
  string of_request_id = 1;
  bool ok = 2;
  string message = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}
