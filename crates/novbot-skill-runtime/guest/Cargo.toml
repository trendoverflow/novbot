[package]
name = "novbot-skill-guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Test guest for the NovBot skill component world"

# Wasm-only crate. An empty workspace keeps it out of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.62"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "symbols"
