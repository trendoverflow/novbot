schema_version = 1
name = "sshd-baseline"
version = "1.0.0"
display_name = "sshd baseline"
description = "Check PermitRootLogin and PasswordAuthentication in sshd_config"

[runtime]
kind = "wasm"
abi = "novbot:skill@1"

[runtime.limits]
timeout_ms = 10000
memory_mb = 32

[files]

[[capabilities]]
name = "fs.read"
scope = "/etc/ssh/sshd_config"
reason = "Read the sshd configuration"
