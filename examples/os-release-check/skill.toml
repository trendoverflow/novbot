schema_version = 1
name = "os-release-check"
version = "1.0.0"
display_name = "OS release check"
description = "Read ID and VERSION_ID from /etc/os-release and the hostname"

[runtime]
kind = "wasm"
abi = "novbot:skill@1"

[runtime.limits]
timeout_ms = 10000
memory_mb = 32

[files]

[[capabilities]]
name = "fs.read"
scope = "/etc/os-release"
reason = "Read the OS identity file"

[[capabilities]]
name = "sys.info.read"
reason = "Read the hostname"
