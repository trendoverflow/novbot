[workspace]
resolver = "2"
members = [
    "crates/novbot-proto",
    "crates/novbot-core",
    "crates/novbot-center",
    "crates/novbot-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["TrendOverflow / NovHub"]
repository = "https://github.com/trendoverflow/novbot"

[workspace.dependencies]
novbot-proto = { path = "crates/novbot-proto" }
novbot-core = { path = "crates/novbot-core" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hostname = "0.4"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
sysinfo = "0.33"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
