[workspace]
resolver = "2"
members = [
    "crates/novbot-proto",
    "crates/novbot-core",
    "crates/novbot-center",
    "crates/novbot-node",
    "crates/novbot-skill-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["TrendOverflow (NovHub Innovation Laboratory)"]
repository = "https://github.com/trendoverflow/novbot"

[workspace.dependencies]
novbot-proto = { path = "crates/novbot-proto" }
novbot-core = { path = "crates/novbot-core" }
novbot-skill-runtime = { path = "crates/novbot-skill-runtime" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
hostname = "0.4"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "=49.0.2", features = ["component-model"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p2"] }
