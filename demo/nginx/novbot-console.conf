# NovBot demo console on the center VM (novbot-ce-arm).
#
# Default bind is loopback only. OrbStack forwards the VM's port 80 to the
# Mac; listening on every interface makes the console reachable on the Mac's
# LAN addresses. Do not use `listen 80;`, `listen 0.0.0.0:80;`, or `listen *:80;`
# unless the LAN opt-in below is in effect.
#
# LAN demo opt-in is OFF by default. `NOVBOT_DEMO_LAN_BIND=1` is documentation
# only — nginx does not read environment variables. Set that flag in the
# runbook only after Product marks "LAN demo allowed" and Fei records a
# written waiver. Then edit this file by hand to:
#     listen 80;
#     # or: listen 0.0.0.0:80;
# Until then the listen line stays `listen 127.0.0.1:80;`.
#
# Never publish center HTTP (:18080) or MySQL (:3306) on the LAN. Clients
# use this site. Static files come from /var/www/novbot-console. /v1/ and
# /health are proxied to the center on http://127.0.0.1:18080.

server {
    listen 127.0.0.1:80;
    server_name _;

    root /var/www/novbot-console;
    index index.html;

    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
